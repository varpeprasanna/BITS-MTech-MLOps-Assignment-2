name: Cats vs Dogs CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # JOB 1: AUTOMATED TESTING
  # ============================================================

  test:
    name: Run Automated Tests

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      # --------------------------------------------------------
      # Run automated tests
      # --------------------------------------------------------

      - name: Run automated tests
        run: |
          pytest -v


  # ============================================================
  # JOB 2: DOCKER IMAGE BUILD
  # ============================================================

  docker:
    name: Build Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Install serving dependencies
      # --------------------------------------------------------

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Verify production trained model
      #
      # IMPORTANT:
      # We intentionally DO NOT run create_test_model.py here.
      #
      # The Docker image must contain the actual trained model
      # stored in:
      #
      # artifacts/best_model.pt
      # --------------------------------------------------------

      - name: Verify production model
        shell: bash
        run: |
          test -f artifacts/best_model.pt

          MODEL_SIZE=$(stat -c%s artifacts/best_model.pt)

          MODEL_HASH=$(sha256sum artifacts/best_model.pt | cut -d ' ' -f 1)

          EXPECTED_HASH="31bb22815535eee13fc70e2651ced7c831b8a25558420c9c81edc4f4610710d4"

          echo "Production model path:"
          echo "  artifacts/best_model.pt"

          echo "Production model size:"
          echo "  ${MODEL_SIZE} bytes"

          echo "Production model SHA256:"
          echo "  ${MODEL_HASH}"

          echo "Expected SHA256:"
          echo "  ${EXPECTED_HASH}"

          if [ "${MODEL_HASH}" != "${EXPECTED_HASH}" ]; then
            echo "ERROR: Production model hash does not match expected model."
            exit 1
          fi

          echo "Production model verified successfully."


      # --------------------------------------------------------
      # Build Docker image
      #
      # Dockerfile copies:
      #
      # artifacts/best_model.pt
      #
      # Therefore the actual trained production model will be
      # packaged inside the image.
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t cats-dogs-api:${{ github.sha }} .


      # --------------------------------------------------------
      # Display Docker image information
      # --------------------------------------------------------

      - name: Inspect Docker image
        run: |
          docker image inspect cats-dogs-api:${{ github.sha }} \
            --format='Image ID: {{.Id}}'

          docker image inspect cats-dogs-api:${{ github.sha }} \
            --format='Image Size: {{.Size}} bytes'
name: Cats vs Dogs CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# Required permissions for publishing to GitHub Container
# Registry (GHCR)
# ============================================================

permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varpeprasanna/bits-mtech-mlops-assignment-2


jobs:

  # ============================================================
  # JOB 1: AUTOMATED TESTING
  # ============================================================

  test:
    name: Run Automated Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      - name: Run automated tests
        run: |
          pytest -v


  # ============================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  docker:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    # Do not publish images for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Install serving dependencies
      # --------------------------------------------------------

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Verify production model
      # --------------------------------------------------------

      - name: Verify production model
        shell: bash
        run: |

          test -f artifacts/best_model.pt

          MODEL_SIZE=$(stat -c%s artifacts/best_model.pt)

          MODEL_HASH=$(sha256sum artifacts/best_model.pt | cut -d ' ' -f 1)

          EXPECTED_HASH="31bb22815535eee13fc70e2651ced7c831b8a25558420c9c81edc4f4610710d4"

          echo "Production model path:"
          echo "  artifacts/best_model.pt"

          echo "Production model size:"
          echo "  ${MODEL_SIZE} bytes"

          echo "Production model SHA256:"
          echo "  ${MODEL_HASH}"

          echo "Expected SHA256:"
          echo "  ${EXPECTED_HASH}"

          if [ "${MODEL_HASH}" != "${EXPECTED_HASH}" ]; then
            echo "ERROR: Production model hash does not match expected model."
            exit 1
          fi

          echo "Production model verified successfully."


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build Docker image
      #
      # Two tags are created:
      #
      # 1. Immutable commit SHA
      # 2. latest convenience tag
      #
      # CD will deploy the immutable SHA tag.
      # --------------------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .


      # --------------------------------------------------------
      # Inspect image
      # --------------------------------------------------------

      - name: Inspect Docker image
        run: |

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image ID: {{.Id}}'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image Size: {{.Size}} bytes'


      # --------------------------------------------------------
      # Push immutable SHA image
      # --------------------------------------------------------

      - name: Push SHA-tagged image
        run: |

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------

      - name: Push latest image
        run: |

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


      # --------------------------------------------------------
      # Display published image
      # --------------------------------------------------------

      - name: Display published image
        run: |

          echo "Published Docker images:"

          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
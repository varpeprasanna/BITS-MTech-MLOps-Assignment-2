name: Cats vs Dogs CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Run Automated Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: |
          pytest -v


  # ============================================================
  # BUILD + PUBLISH
  # ============================================================

  docker:
    name: Build and Publish Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python is required only to generate the CI checkpoint.
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Create deterministic CI model.
      #
      # This is NOT the production trained model.
      # It only allows CI to validate the Docker build.
      # --------------------------------------------------------

      - name: Create CI model checkpoint
        run: |
          python scripts/create_test_model.py


      # --------------------------------------------------------
      # Log in to GitHub Container Registry.
      #
      # GITHUB_TOKEN is automatically provided by GitHub Actions.
      # --------------------------------------------------------

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Extract Docker metadata / tags.
      # --------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}


      # --------------------------------------------------------
      # Build Docker image.
      #
      # This runs for both push and pull_request.
      # --------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      # --------------------------------------------------------
      # Publish image to GHCR.
      #
      # Only main branch pushes publish an image.
      # Pull requests only build/test.
      # --------------------------------------------------------

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
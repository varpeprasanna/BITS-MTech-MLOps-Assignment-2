name: Cats vs Dogs CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varpeprasanna/bits-mtech-mlops-assignment-2


jobs:

  # ============================================================
  # JOB 1: AUTOMATED TESTING
  # ============================================================

  test:
    name: Run Automated Tests

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      # --------------------------------------------------------
      # Run automated tests
      # --------------------------------------------------------

      - name: Run automated tests
        run: |
          pytest -v


  # ============================================================
  # JOB 2: DOCKER IMAGE BUILD AND PUBLISH
  # ============================================================

  docker:
    name: Build and Publish Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Install serving dependencies
      # --------------------------------------------------------

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Verify production trained model
      # --------------------------------------------------------

      - name: Verify production model
        shell: bash
        run: |
          set -e

          test -f artifacts/best_model.pt

          MODEL_SIZE=$(stat -c%s artifacts/best_model.pt)

          MODEL_HASH=$(sha256sum artifacts/best_model.pt | cut -d ' ' -f 1)

          EXPECTED_HASH="31bb22815535eee13fc70e2651ced7c831b8a25558420c9c81edc4f4610710d4"

          echo "Production model path:"
          echo "  artifacts/best_model.pt"

          echo "Production model size:"
          echo "  ${MODEL_SIZE} bytes"

          echo "Production model SHA256:"
          echo "  ${MODEL_HASH}"

          echo "Expected SHA256:"
          echo "  ${EXPECTED_HASH}"

          if [ "${MODEL_HASH}" != "${EXPECTED_HASH}" ]; then
            echo "ERROR: Production model hash does not match expected model."
            exit 1
          fi

          echo "Production model verified successfully."


      # --------------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build production Docker image
      #
      # IMPORTANT:
      #
      # --platform linux/amd64
      #   Ensures the image is explicitly built for the Kind
      #   node architecture.
      #
      # --provenance=false
      #   Prevents BuildKit provenance/attestation metadata from
      #   being attached to the published image.
      #
      # This intentionally produces a simple single-platform
      # Linux/amd64 image that can be transferred from GHCR to
      # the local Kind registry.
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .


      # --------------------------------------------------------
      # Inspect SHA image
      # --------------------------------------------------------

      - name: Inspect SHA Docker image
        run: |
          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image ID: {{.Id}}'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image Size: {{.Size}} bytes'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Architecture: {{.Architecture}}'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='OS: {{.Os}}'


      # --------------------------------------------------------
      # Verify image architecture
      # --------------------------------------------------------

      - name: Verify Linux amd64 image
        shell: bash
        run: |
          set -e

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          ARCH=$(docker image inspect "$IMAGE" --format='{{.Architecture}}')
          OS=$(docker image inspect "$IMAGE" --format='{{.Os}}')

          echo "Image OS: ${OS}"
          echo "Image architecture: ${ARCH}"

          if [ "$OS" != "linux" ]; then
            echo "ERROR: Docker image OS is not linux."
            exit 1
          fi

          if [ "$ARCH" != "amd64" ]; then
            echo "ERROR: Docker image architecture is not amd64."
            exit 1
          fi

          echo "Linux/amd64 image verified successfully."


      # --------------------------------------------------------
      # Push immutable SHA image
      # --------------------------------------------------------

      - name: Push SHA image to GHCR
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------

      - name: Push latest image to GHCR
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


      # --------------------------------------------------------
      # Verify pushed SHA image
      # --------------------------------------------------------

      - name: Verify pushed image
        run: |
          docker pull \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Pulled image ID: {{.Id}}'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Pulled image architecture: {{.Architecture}}'

          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Pulled image OS: {{.Os}}'
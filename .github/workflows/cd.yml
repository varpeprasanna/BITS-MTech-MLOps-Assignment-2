name: Cats vs Dogs CD

on:
  workflow_run:
    workflows:
      - "Cats vs Dogs CI"
    types:
      - completed
    branches:
      - main


permissions:
  contents: read
  packages: read


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varpeprasanna/bits-mtech-mlops-assignment-2

  LOCAL_REGISTRY: localhost:5001
  LOCAL_IMAGE_NAME: cats-dogs-api

  K8S_DEPLOYMENT: cats-dogs-api
  K8S_CONTAINER: cats-dogs-api


jobs:

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy to Local Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on:
      - self-hosted
      - Windows
      - X64
      - mlops

    steps:

      # ========================================================
      # 1. Checkout repository at the exact CI commit
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # ========================================================
      # 2. Calculate exact deployment image
      # ========================================================

      - name: Set deployment image
        shell: powershell
        run: |
          $FULL_SHA = "${{ github.event.workflow_run.head_sha }}"

          if ([string]::IsNullOrWhiteSpace($FULL_SHA)) {
              Write-Error "CI commit SHA is empty."
              exit 1
          }

          $DEPLOY_IMAGE = "${env:REGISTRY}/${env:IMAGE_NAME}:${FULL_SHA}"
          $LOCAL_IMAGE = "${env:LOCAL_REGISTRY}/${env:LOCAL_IMAGE_NAME}:${FULL_SHA}"

          "FULL_SHA=$FULL_SHA" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "DEPLOY_IMAGE=$DEPLOY_IMAGE" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "LOCAL_IMAGE=$LOCAL_IMAGE" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "CI commit SHA:"
          Write-Host $FULL_SHA

          Write-Host ""
          Write-Host "GHCR deployment image:"
          Write-Host $DEPLOY_IMAGE

          Write-Host ""
          Write-Host "Local registry image:"
          Write-Host $LOCAL_IMAGE


      # ========================================================
      # 3. Verify Docker
      # ========================================================

      - name: Verify Docker
        shell: powershell
        run: |
          docker version --format "{{.Server.Version}}"


      # ========================================================
      # 4. Verify Kind
      # ========================================================

      - name: Verify Kind cluster
        shell: powershell
        run: |
          Write-Host "Kind clusters:"
          kind get clusters

          Write-Host ""
          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          Write-Host ""
          Write-Host "Kubernetes nodes:"
          kubectl get nodes


      # ========================================================
      # 5. Verify local registry
      # ========================================================

      - name: Verify local registry
        shell: powershell
        run: |
          Write-Host "Checking local registry..."

          $response = Invoke-WebRequest `
            -Uri "http://localhost:5001/v2/" `
            -UseBasicParsing `
            -TimeoutSec 10

          if ($response.StatusCode -ne 200) {
              Write-Error "Local registry is not healthy."
              exit 1
          }

          Write-Host "Local registry is healthy."


      # ========================================================
      # 6. Pull EXACT SHA image from GHCR
      # ========================================================

      - name: Pull exact image from GHCR
        shell: powershell
        run: |
          Write-Host "Pulling exact CI image:"
          Write-Host $env:DEPLOY_IMAGE

          docker pull $env:DEPLOY_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to pull exact CI image from GHCR."
              exit 1
          }


      # ========================================================
      # 7. Verify pulled image
      # ========================================================

      - name: Verify pulled image
        shell: powershell
        run: |
          Write-Host "Checking Docker image:"

          docker image inspect $env:DEPLOY_IMAGE `
            --format "ID={{.Id}} Size={{.Size}} Architecture={{.Architecture}} OS={{.Os}}"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Exact deployment image is not available locally."
              exit 1
          }

          $architecture = docker image inspect $env:DEPLOY_IMAGE `
            --format "{{.Architecture}}"

          $os = docker image inspect $env:DEPLOY_IMAGE `
            --format "{{.Os}}"

          Write-Host "OS: $os"
          Write-Host "Architecture: $architecture"

          if ($os -ne "linux") {
              Write-Error "Expected Linux image."
              exit 1
          }

          if ($architecture -ne "amd64") {
              Write-Error "Expected amd64 image."
              exit 1
          }

          Write-Host "Image architecture verified."


      # ========================================================
      # 8. Tag exact image for local Kind registry
      # ========================================================

      - name: Tag image for local registry
        shell: powershell
        run: |
          Write-Host "Tagging:"
          Write-Host $env:DEPLOY_IMAGE

          Write-Host ""
          Write-Host "As:"
          Write-Host $env:LOCAL_IMAGE

          docker tag `
            $env:DEPLOY_IMAGE `
            $env:LOCAL_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to tag image for local registry."
              exit 1
          }


      # ========================================================
      # 9. Push exact image to local registry
      # ========================================================

      - name: Push image to local registry
        shell: powershell
        run: |
          Write-Host "Pushing:"
          Write-Host $env:LOCAL_IMAGE

          docker push $env:LOCAL_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push image to local registry."
              exit 1
          }


      # ========================================================
      # 10. Verify local registry image
      # ========================================================

      - name: Verify local registry image
        shell: powershell
        run: |
          $repository = "${env:LOCAL_IMAGE_NAME}"
          $tag = "${env:FULL_SHA}"

          Write-Host "Checking local registry repository:"
          Write-Host $repository

          $response = Invoke-RestMethod `
            -Uri "http://localhost:5001/v2/$repository/tags/list" `
            -TimeoutSec 10

          Write-Host ""
          Write-Host "Registry response:"
          $response | ConvertTo-Json

          if ($null -eq $response.tags) {
              Write-Error "No tags found for local application image."
              exit 1
          }

          if ($response.tags -notcontains $tag) {
              Write-Error "Expected SHA tag was not found in local registry."
              exit 1
          }

          Write-Host ""
          Write-Host "Exact SHA image exists in local registry."


      # ========================================================
      # 11. Apply Kubernetes manifests
      # ========================================================

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


      # ========================================================
      # 12. Set EXACT immutable deployment image
      #
      # IMPORTANT:
      # We intentionally do NOT use:
      #
      #   latest
      #   kubectl rollout restart
      #   kind load docker-image
      #
      # Kubernetes receives the exact SHA-tagged image.
      # ========================================================

      - name: Set exact Kubernetes image
        shell: powershell
        run: |
          Write-Host "Deploying exact image:"
          Write-Host $env:LOCAL_IMAGE

          kubectl set image `
            deployment/$env:K8S_DEPLOYMENT `
            $env:K8S_CONTAINER=$env:LOCAL_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to update Kubernetes deployment image."
              exit 1
          }


      # ========================================================
      # 13. Ensure immutable SHA image policy
      # ========================================================

      - name: Verify image pull policy
        shell: powershell
        run: |
          $pullPolicy = kubectl get deployment $env:K8S_DEPLOYMENT `
            -o jsonpath="{.spec.template.spec.containers[0].imagePullPolicy}"

          Write-Host "Image pull policy: $pullPolicy"

          if ($pullPolicy -ne "IfNotPresent") {
              Write-Error "Expected imagePullPolicy=IfNotPresent."
              exit 1
          }


      # ========================================================
      # 14. Wait for rollout
      # ========================================================

      - name: Wait for deployment rollout
        shell: powershell
        run: |
          kubectl rollout status `
            deployment/$env:K8S_DEPLOYMENT `
            --timeout=300s

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Kubernetes deployment rollout failed."
              exit 1
          }


      # ========================================================
      # 15. Verify deployed image EXACTLY matches SHA
      # ========================================================

      - name: Verify deployed image
        shell: powershell
        run: |
          $deployedImage = kubectl get deployment $env:K8S_DEPLOYMENT `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host "Expected image:"
          Write-Host $env:LOCAL_IMAGE

          Write-Host ""
          Write-Host "Actual deployed image:"
          Write-Host $deployedImage

          if ($deployedImage -ne $env:LOCAL_IMAGE) {
              Write-Error "Deployed image does not match expected SHA image."
              exit 1
          }

          Write-Host ""
          Write-Host "Exact SHA image verified in Kubernetes."


      # ========================================================
      # 16. Verify deployment / pod / service
      # ========================================================

      - name: Verify deployed resources
        shell: powershell
        run: |
          Write-Host "Deployment:"
          kubectl get deployment $env:K8S_DEPLOYMENT -o wide

          Write-Host ""
          Write-Host "Pods:"
          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide

          Write-Host ""
          Write-Host "Service:"
          kubectl get service cats-dogs-api


      # ========================================================
      # 17. Start port-forward
      # ========================================================

      - name: Start port-forward
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward service/cats-dogs-api 8001:8000" `
            -PassThru `
            -WindowStyle Hidden

          $process.Id | Out-File `
            "$env:RUNNER_TEMP\cats-dogs-port-forward.pid" `
            -Encoding ascii

          Write-Host "Port-forward started."
          Write-Host "PID: $($process.Id)"


      # ========================================================
      # 18. Wait for API health
      # ========================================================

      - name: Wait for API health
        shell: powershell
        run: |
          $maxAttempts = 60
          $attempt = 0

          while ($attempt -lt $maxAttempts) {

              try {

                  $response = Invoke-RestMethod `
                    -Uri "http://localhost:8001/health" `
                    -TimeoutSec 5

                  Write-Host "Health response:"
                  $response | ConvertTo-Json

                  if (
                      $response.status -eq "healthy" -and
                      $response.model_loaded -eq $true
                  ) {
                      Write-Host "API is healthy."
                      exit 0
                  }

              }
              catch {
                  Write-Host "API not ready yet..."
              }

              Start-Sleep -Seconds 2
              $attempt++
          }

          Write-Error "API did not become healthy."
          exit 1


      # ========================================================
      # 19. Run post-deployment smoke test
      # ========================================================

      - name: Run post-deployment smoke test
        shell: powershell
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8001
        run: |
          python scripts/smoke_test.py

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Post-deployment smoke test failed."
              exit 1
          }


      # ========================================================
      # 20. Show deployment logs
      # ========================================================

      - name: Show deployment logs
        if: always()
        shell: powershell
        run: |
          kubectl logs `
            deployment/$env:K8S_DEPLOYMENT `
            --tail=100


      # ========================================================
      # 21. Final Kubernetes state
      # ========================================================

      - name: Show final Kubernetes state
        if: always()
        shell: powershell
        run: |
          Write-Host "Final deployment:"
          kubectl get deployment $env:K8S_DEPLOYMENT -o wide

          Write-Host ""
          Write-Host "Final pods:"
          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide

          Write-Host ""
          Write-Host "Final service:"
          kubectl get service cats-dogs-api


      # ========================================================
      # 22. Cleanup port-forward
      # ========================================================

      - name: Cleanup port-forward
        if: always()
        shell: powershell
        run: |
          $pidFile = "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"

          if (Test-Path $pidFile) {

              $processId = Get-Content $pidFile

              Write-Host "Stopping port-forward process $processId"

              Stop-Process `
                -Id $processId `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $pidFile `
                -Force `
                -ErrorAction SilentlyContinue
          }
name: Cats vs Dogs CD

on:
  workflow_run:
    workflows:
      - "Cats vs Dogs CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # DEPLOYMENT JOB
  # ============================================================

  deploy:

    name: Deploy to Local Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on:
      - self-hosted
      - Windows
      - X64
      - mlops

    steps:

      # ==========================================================
      # 1. Checkout exact commit that passed CI
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # ==========================================================
      # 2. Verify Docker
      # ==========================================================

      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "Docker version:"
          docker version --format "{{.Server.Version}}"

          Write-Host ""
          Write-Host "Docker containers:"
          docker ps


      # ==========================================================
      # 3. Verify Kind cluster exists
      # ==========================================================

      - name: Verify Kind cluster
        shell: powershell
        run: |

          Write-Host "Kind clusters:"
          kind get clusters

          $clusters = kind get clusters

          if ($clusters -notcontains "cats-dogs-mlops") {
              Write-Error "Kind cluster 'cats-dogs-mlops' does not exist."
              exit 1
          }

          Write-Host ""
          Write-Host "Kind cluster 'cats-dogs-mlops' exists."


      # ==========================================================
      # 4. Verify Kubernetes context
      # ==========================================================

      - name: Verify Kubernetes context
        shell: powershell
        run: |

          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          $context = kubectl config current-context

          if ($context -ne "kind-cats-dogs-mlops") {
              Write-Error "Unexpected Kubernetes context: $context"
              exit 1
          }

          Write-Host ""
          Write-Host "Correct Kubernetes context confirmed."


      # ==========================================================
      # 5. Verify Kubernetes API server
      # ==========================================================

      - name: Verify Kubernetes cluster health
        shell: powershell
        run: |

          Write-Host "Kubernetes cluster information:"
          kubectl cluster-info

          Write-Host ""
          Write-Host "Kubernetes nodes:"
          kubectl get nodes

          Write-Host ""
          Write-Host "Node readiness:"
          kubectl wait `
            --for=condition=Ready `
            node/cats-dogs-mlops-control-plane `
            --timeout=60s


      # ==========================================================
      # 6. Verify existing deployment
      # ==========================================================

      - name: Inspect existing deployment
        shell: powershell
        run: |

          Write-Host "Existing deployment:"
          kubectl get deployment cats-dogs-api -o wide

          Write-Host ""
          Write-Host "Existing pods:"
          kubectl get pods -l app=cats-dogs-api -o wide

          Write-Host ""
          Write-Host "Existing service:"
          kubectl get service cats-dogs-api


      # ==========================================================
      # 7. Apply Kubernetes manifests
      # ==========================================================

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


      # ==========================================================
      # 8. Force latest registry image
      # ==========================================================

      - name: Restart deployment
        shell: powershell
        run: |

          kubectl rollout restart deployment/cats-dogs-api


      # ==========================================================
      # 9. Wait for rollout
      # ==========================================================

      - name: Wait for deployment rollout
        shell: powershell
        run: |

          kubectl rollout status `
            deployment/cats-dogs-api `
            --timeout=180s


      # ==========================================================
      # 10. Verify deployed resources
      # ==========================================================

      - name: Verify deployed resources
        shell: powershell
        run: |

          Write-Host "Deployment:"
          kubectl get deployment cats-dogs-api -o wide

          Write-Host ""
          Write-Host "Pods:"
          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide

          Write-Host ""
          Write-Host "Service:"
          kubectl get service cats-dogs-api


      # ==========================================================
      # 11. Start port-forward
      # ==========================================================

      - name: Start port-forward
        shell: powershell
        run: |

          $pidFile = "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"

          if (Test-Path $pidFile) {
              Remove-Item $pidFile -Force
          }

          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward service/cats-dogs-api 8001:8000" `
            -PassThru `
            -WindowStyle Hidden

          $process.Id | Out-File $pidFile

          Write-Host "Port-forward PID: $($process.Id)"


      # ==========================================================
      # 12. Wait for API health
      # ==========================================================

      - name: Wait for API health
        shell: powershell
        run: |

          $maxAttempts = 30
          $attempt = 0

          while ($attempt -lt $maxAttempts) {

              try {

                  $response = Invoke-RestMethod `
                    -Uri "http://localhost:8001/health" `
                    -TimeoutSec 5

                  Write-Host ""
                  Write-Host "Health response:"
                  $response | ConvertTo-Json

                  if ($response.status -eq "healthy" -and
                      $response.model_loaded -eq $true) {

                      Write-Host ""
                      Write-Host "API health check PASSED."
                      exit 0
                  }

              }
              catch {

                  Write-Host "API not ready yet..."
              }

              Start-Sleep -Seconds 2
              $attempt++
          }

          Write-Error "API did not become healthy within the expected time."
          exit 1


      # ==========================================================
      # 13. Run post-deployment smoke test
      # ==========================================================

      - name: Run post-deployment smoke test
        shell: powershell
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8001
        run: |

          python scripts/smoke_test.py


      # ==========================================================
      # 14. Display deployment logs
      # ==========================================================

      - name: Show deployment logs
        if: always()
        shell: powershell
        run: |

          Write-Host "Deployment logs:"
          kubectl logs deployment/cats-dogs-api --tail=50


      # ==========================================================
      # 15. Display final Kubernetes state
      # ==========================================================

      - name: Final deployment state
        if: always()
        shell: powershell
        run: |

          Write-Host "Nodes:"
          kubectl get nodes

          Write-Host ""
          Write-Host "Deployment:"
          kubectl get deployment cats-dogs-api

          Write-Host ""
          Write-Host "Pods:"
          kubectl get pods -l app=cats-dogs-api -o wide

          Write-Host ""
          Write-Host "Services:"
          kubectl get services


      # ==========================================================
      # 16. Cleanup port-forward
      # ==========================================================

      - name: Cleanup port-forward
        if: always()
        shell: powershell
        run: |

          $pidFile = "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"

          if (Test-Path $pidFile) {

              $processId = Get-Content $pidFile

              Write-Host "Stopping port-forward process $processId"

              Stop-Process `
                -Id $processId `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $pidFile `
                -Force `
                -ErrorAction SilentlyContinue
          }
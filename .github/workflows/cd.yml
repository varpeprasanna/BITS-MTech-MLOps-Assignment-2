name: Cats vs Dogs CD

on:
  workflow_run:
    workflows:
      - "Cats vs Dogs CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varpeprasanna/bits-mtech-mlops-assignment-2

jobs:

  deploy:

    name: Deploy to Local Kubernetes

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on:
      - self-hosted
      - Windows
      - X64
      - mlops

    steps:

      # ========================================================
      # 1. Checkout exact commit that triggered CI
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # ========================================================
      # 2. Set exact immutable image
      # ========================================================

      - name: Set deployment image
        shell: powershell
        run: |

          $image = "${env:REGISTRY}/${env:IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"

          "DEPLOY_IMAGE=$image" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "=========================================="
          Write-Host "Deployment image:"
          Write-Host $image
          Write-Host "=========================================="


      # ========================================================
      # 3. Verify Docker
      # ========================================================

      - name: Verify Docker
        shell: powershell
        run: |

          docker version

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker is not available."
              exit 1
          }


      # ========================================================
      # 4. Verify Kind / Kubernetes
      # ========================================================

      - name: Verify Kubernetes cluster
        shell: powershell
        run: |

          Write-Host "Kind clusters:"
          kind get clusters

          Write-Host ""
          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          Write-Host ""
          Write-Host "Kubernetes nodes:"
          kubectl get nodes

          Write-Host ""
          Write-Host "Current deployment:"
          kubectl get deployment cats-dogs-api -o wide


      # ========================================================
      # 5. Pull EXACT image from GHCR
      #
      # Do NOT use :latest.
      # Pull the immutable CI commit SHA.
      # ========================================================

      - name: Pull deployment image
        shell: powershell
        run: |

          Write-Host "Pulling image:"
          Write-Host $env:DEPLOY_IMAGE

          docker pull $env:DEPLOY_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to pull deployment image."
              exit 1
          }


      # ========================================================
      # 6. Verify image exists
      # ========================================================

      - name: Verify deployment image
        shell: powershell
        run: |

          Write-Host "Verifying image locally..."

          docker image inspect $env:DEPLOY_IMAGE `
            --format "Image ID: {{.Id}}"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Deployment image is not available locally."
              exit 1
          }


      # ========================================================
      # 7. Load EXACT image into Kind
      #
      # Kind has its own container runtime/image store.
      # ========================================================

      - name: Load image into Kind
        shell: powershell
        run: |

          Write-Host "Loading image into Kind:"
          Write-Host $env:DEPLOY_IMAGE

          kind load docker-image $env:DEPLOY_IMAGE `
            --name cats-dogs-mlops

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to load image into Kind."
              exit 1
          }


      # ========================================================
      # 8. Verify image inside Kind node
      # ========================================================

      - name: Verify image inside Kind
        shell: powershell
        run: |

          Write-Host "Images available inside Kind:"

          docker exec `
            cats-dogs-mlops-control-plane `
            crictl images

          Write-Host ""
          Write-Host "Checking exact deployment image..."

          docker exec `
            cats-dogs-mlops-control-plane `
            crictl images | Select-String "${{ github.event.workflow_run.head_sha }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Exact deployment image was not found inside Kind."
              exit 1
          }


      # ========================================================
      # 9. Apply Kubernetes manifests
      # ========================================================

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to apply deployment manifest."
              exit 1
          }

          kubectl apply -f k8s/service.yaml

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to apply service manifest."
              exit 1
          }


      # ========================================================
      # 10. Configure image pull policy
      #
      # The image is already loaded into Kind.
      # ========================================================

      - name: Configure image pull policy
        shell: powershell
        run: |

          kubectl patch deployment cats-dogs-api `
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"cats-dogs-api","imagePullPolicy":"IfNotPresent"}]}}}}'

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to configure imagePullPolicy."
              exit 1
          }


      # ========================================================
      # 11. Set EXACT deployment image
      # ========================================================

      - name: Update deployment image
        shell: powershell
        run: |

          Write-Host "Updating Kubernetes deployment to:"
          Write-Host $env:DEPLOY_IMAGE

          kubectl set image deployment/cats-dogs-api `
            cats-dogs-api=$env:DEPLOY_IMAGE

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to update deployment image."
              exit 1
          }


      # ========================================================
      # 12. Wait for rollout
      # ========================================================

      - name: Wait for deployment rollout
        shell: powershell
        run: |

          kubectl rollout status `
            deployment/cats-dogs-api `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "Rollout failed. Current state:"

              kubectl get pods `
                -l app=cats-dogs-api `
                -o wide

              Write-Host ""

              kubectl describe deployment cats-dogs-api

              exit 1
          }


      # ========================================================
      # 13. Verify deployed image
      # ========================================================

      - name: Verify deployed image
        shell: powershell
        run: |

          $deployedImage = kubectl get deployment cats-dogs-api `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host "Expected image:"
          Write-Host $env:DEPLOY_IMAGE

          Write-Host ""
          Write-Host "Actual deployed image:"
          Write-Host $deployedImage

          if ($deployedImage -ne $env:DEPLOY_IMAGE) {
              Write-Error "Deployed image does not match CI image."
              exit 1
          }

          Write-Host ""
          Write-Host "Deployment image verified successfully."


      # ========================================================
      # 14. Verify Kubernetes resources
      # ========================================================

      - name: Verify Kubernetes resources
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "DEPLOYMENT"
          Write-Host "=========================================="

          kubectl get deployment cats-dogs-api


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PODS"
          Write-Host "=========================================="

          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "SERVICE"
          Write-Host "=========================================="

          kubectl get service cats-dogs-api


      # ========================================================
      # 15. Start port-forward
      # ========================================================

      - name: Start port-forward
        shell: powershell
        run: |

          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward service/cats-dogs-api 8001:8000" `
            -PassThru `
            -WindowStyle Hidden

          $process.Id | Out-File `
            "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"

          Write-Host "Port-forward started."
          Write-Host "PID: $($process.Id)"


      # ========================================================
      # 16. Wait for API health
      # ========================================================

      - name: Wait for API
        shell: powershell
        run: |

          $maxAttempts = 30
          $attempt = 0

          while ($attempt -lt $maxAttempts) {

              try {

                  $response = Invoke-RestMethod `
                    -Uri "http://localhost:8001/health" `
                    -TimeoutSec 5

                  Write-Host "Health response:"
                  $response | ConvertTo-Json

                  if ($response.status -eq "healthy") {

                      Write-Host ""
                      Write-Host "API is healthy."

                      exit 0
                  }

              }
              catch {

                  Write-Host "API not ready yet..."
              }

              Start-Sleep -Seconds 2
              $attempt++
          }

          Write-Error "API did not become healthy."
          exit 1


      # ========================================================
      # 17. Post-deployment smoke test
      # ========================================================

      - name: Run post-deployment smoke test
        shell: powershell
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8001
        run: |

          python scripts/smoke_test.py

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Post-deployment smoke test failed."
              exit 1
          }


      # ========================================================
      # 18. Show logs
      # ========================================================

      - name: Show deployment logs
        if: always()
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "DEPLOYMENT LOGS"
          Write-Host "=========================================="

          kubectl logs deployment/cats-dogs-api --tail=50


      # ========================================================
      # 19. Final status
      # ========================================================

      - name: Final deployment status
        if: always()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL KUBERNETES STATUS"
          Write-Host "=========================================="

          kubectl get nodes

          Write-Host ""

          kubectl get deployment cats-dogs-api

          Write-Host ""

          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide

          Write-Host ""

          kubectl get service cats-dogs-api


      # ========================================================
      # 20. Cleanup port-forward
      # ========================================================

      - name: Cleanup port-forward
        if: always()
        shell: powershell
        run: |

          $pidFile = "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"

          if (Test-Path $pidFile) {

              $processId = Get-Content $pidFile

              Write-Host "Stopping port-forward process $processId"

              Stop-Process `
                -Id $processId `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $pidFile `
                -Force `
                -ErrorAction SilentlyContinue
          }
name: Cats vs Dogs CD

on:

  workflow_run:
    workflows:
      - "Cats vs Dogs CI"

    types:
      - completed

    branches:
      - main


permissions:
  contents: read
  packages: read


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varpeprasanna/bits-mtech-mlops-assignment-2


jobs:

  # ============================================================
  # DEPLOYMENT JOB
  # ============================================================

  deploy:

    name: Deploy to Local Kubernetes

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on:
      - self-hosted
      - Windows
      - X64
      - mlops


    steps:

      # ========================================================
      # 1. Checkout the exact commit that triggered CI
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # ========================================================
      # 2. Determine image tag
      #
      # IMPORTANT:
      # Use the SHA of the CI workflow that just succeeded.
      #
      # This prevents CD from accidentally deploying an older
      # :latest image.
      # ========================================================

      - name: Set deployment image
        shell: powershell
        run: |

          $image = "${env:REGISTRY}/${env:IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"

          "DEPLOY_IMAGE=$image" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Deployment image:"
          Write-Host $image


      # ========================================================
      # 3. Verify Docker
      # ========================================================

      - name: Verify Docker
        shell: powershell
        run: |

          docker version --format "{{.Server.Version}}"


      # ========================================================
      # 4. Verify Kubernetes
      # ========================================================

      - name: Verify Kubernetes cluster
        shell: powershell
        run: |

          Write-Host "Current Kubernetes context:"

          kubectl config current-context


          Write-Host ""

          Write-Host "Kubernetes nodes:"

          kubectl get nodes


          Write-Host ""

          Write-Host "Existing deployment:"

          kubectl get deployment cats-dogs-api -o wide


      # ========================================================
      # 5. Verify target image exists locally in Docker
      #
      # This makes the self-hosted Kind setup more reliable.
      #
      # If the image is not already present, download it from
      # GHCR.
      # ========================================================

      - name: Ensure deployment image is available
        shell: powershell
        run: |

          Write-Host "Checking Docker image:"

          docker image inspect $env:DEPLOY_IMAGE > $null 2>&1

          if ($LASTEXITCODE -ne 0) {

              Write-Host "Image not available locally."

              Write-Host "Pulling from GHCR..."

              docker pull $env:DEPLOY_IMAGE

          }
          else {

              Write-Host "Image already available locally."

          }


      # ========================================================
      # 6. Load image into Kind
      #
      # Kind nodes do not automatically share the host Docker
      # image cache.
      #
      # Loading the exact SHA image prevents ImagePullBackOff.
      # ========================================================

      - name: Load image into Kind
        shell: powershell
        run: |

          kind load docker-image $env:DEPLOY_IMAGE `
            --name cats-dogs-mlops


      # ========================================================
      # 7. Apply Kubernetes manifests
      # ========================================================

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml


      # ========================================================
      # 8. Update deployment image
      #
      # This is the critical CD step.
      #
      # The deployment receives the EXACT image generated by
      # the successful CI workflow.
      # ========================================================

      - name: Update deployment image
        shell: powershell
        run: |

          Write-Host "Deploying:"
          Write-Host $env:DEPLOY_IMAGE

          kubectl set image deployment/cats-dogs-api `
            cats-dogs-api=$env:DEPLOY_IMAGE


      # ========================================================
      # 9. Prevent unnecessary registry pulls
      #
      # The exact image was loaded directly into Kind above.
      # ========================================================

      - name: Configure image pull policy
        shell: powershell
        run: |

          kubectl patch deployment cats-dogs-api `
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"cats-dogs-api","imagePullPolicy":"IfNotPresent"}]}}}}'


      # ========================================================
      # 10. Wait for rollout
      # ========================================================

      - name: Wait for deployment rollout
        shell: powershell
        run: |

          kubectl rollout status `
            deployment/cats-dogs-api `
            --timeout=180s


      # ========================================================
      # 11. Verify deployed image
      # ========================================================

      - name: Verify deployed image
        shell: powershell
        run: |

          Write-Host "Deployment image:"

          kubectl get deployment cats-dogs-api `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host ""


          Write-Host "Pods:"

          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide


      # ========================================================
      # 12. Verify deployment resources
      # ========================================================

      - name: Verify Kubernetes resources
        shell: powershell
        run: |

          Write-Host "Deployment:"

          kubectl get deployment cats-dogs-api


          Write-Host ""

          Write-Host "Pods:"

          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide


          Write-Host ""

          Write-Host "Service:"

          kubectl get service cats-dogs-api


      # ========================================================
      # 13. Start port-forward
      # ========================================================

      - name: Start port-forward
        shell: powershell
        run: |

          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward service/cats-dogs-api 8001:8000" `
            -PassThru `
            -WindowStyle Hidden


          $process.Id | Out-File `
            "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"


          Write-Host "Port-forward started."

          Write-Host "PID: $($process.Id)"


      # ========================================================
      # 14. Wait for API health
      # ========================================================

      - name: Wait for API
        shell: powershell
        run: |

          $maxAttempts = 30

          $attempt = 0


          while ($attempt -lt $maxAttempts) {

              try {

                  $response = Invoke-RestMethod `
                      -Uri "http://localhost:8001/health" `
                      -TimeoutSec 5


                  if ($response.status -eq "healthy") {

                      Write-Host "API is healthy."

                      $response | ConvertTo-Json

                      exit 0
                  }

              }

              catch {

                  Write-Host "API not ready yet..."

              }


              Start-Sleep -Seconds 2

              $attempt++
          }


          Write-Error "API did not become healthy."

          exit 1


      # ========================================================
      # 15. Post-deployment smoke test
      # ========================================================

      - name: Run post-deployment smoke test
        shell: powershell
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8001
        run: |

          python scripts/smoke_test.py


      # ========================================================
      # 16. Deployment logs
      # ========================================================

      - name: Show deployment logs
        if: always()
        shell: powershell
        run: |

          kubectl logs deployment/cats-dogs-api --tail=50


      # ========================================================
      # 17. Final deployment status
      # ========================================================

      - name: Final deployment status
        if: always()
        shell: powershell
        run: |

          Write-Host "=========================================="

          Write-Host "FINAL KUBERNETES STATUS"

          Write-Host "=========================================="


          kubectl get nodes


          Write-Host ""

          kubectl get deployment cats-dogs-api


          Write-Host ""

          kubectl get pods `
            -l app=cats-dogs-api `
            -o wide


          Write-Host ""

          kubectl get service cats-dogs-api


      # ========================================================
      # 18. Cleanup port-forward
      # ========================================================

      - name: Cleanup port-forward
        if: always()
        shell: powershell
        run: |

          $pidFile = "$env:RUNNER_TEMP\cats-dogs-port-forward.pid"


          if (Test-Path $pidFile) {

              $processId = Get-Content $pidFile


              Write-Host "Stopping port-forward process $processId"


              Stop-Process `
                  -Id $processId `
                  -Force `
                  -ErrorAction SilentlyContinue


              Remove-Item `
                  $pidFile `
                  -Force `
                  -ErrorAction SilentlyContinue
          }